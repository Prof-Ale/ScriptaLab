name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check          # testes do núcleo + validação dos perfis de IES
      - name: Conferir hashes SRI dos CDNs
        run: bash tools/sri.sh
